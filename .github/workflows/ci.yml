name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: auditmind
          POSTGRES_PASSWORD: auditmind
          POSTGRES_DB: auditmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditmind -d auditmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://auditmind:auditmind@localhost:5432/auditmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Verify TestClient imports without deprecated fallback
        run: python -W error -c "from fastapi.testclient import TestClient"
      - name: Enable pgvector in the test database
        run: psql "postgresql://auditmind:auditmind@localhost:5432/auditmind_test" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Enable indexed search support
        run: psql "postgresql://auditmind:auditmind@localhost:5432/auditmind_test" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - run: pytest --require-postgres -W error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  backend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip install bandit==1.9.4
      - name: Check tracked files for high-confidence secrets
        run: python scripts/check_tracked_secrets.py
        working-directory: .
      - name: Check high-severity Python static findings
        run: python -m bandit -r app -lll
      - run: python -m pip_audit -r requirements-dev.txt
      - name: Audit optional embeddings dependency manifest
        run: python -m pip_audit -r requirements-embeddings.txt

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: auditmind
          POSTGRES_PASSWORD: auditmind
          POSTGRES_DB: auditmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditmind -d auditmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://auditmind:auditmind@localhost:5432/auditmind_test
      AUDITMIND_BROWSER_PYTHON: python
      AUDITMIND_BROWSER_CHANNEL: chromium
      AUDITMIND_ISOLATED_BUILD: "1"
      BACKEND_URL: http://127.0.0.1:8012
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - name: Enable browser test database extensions
        run: psql "postgresql://auditmind:auditmind@localhost:5432/auditmind_test" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/browser-finding-workflow.cjs
      - name: Verify durable evaluation, opt-in scoring and seven-domain pilot
        run: node scripts/browser-evidence-acceptance.cjs --pilot
      - name: Verify bounded worker pool, fairness and crash recovery
        run: node scripts/worker-pool-acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: |
            temp/testing/finding-workflow
            temp/testing/evidence-review
            temp/testing/worker-pool
