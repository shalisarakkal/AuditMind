name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: auditmind
          POSTGRES_PASSWORD: auditmind
          POSTGRES_DB: auditmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://auditmind:auditmind@localhost:5432/auditmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Enable pgvector in the test database
        run: psql "postgresql://auditmind:auditmind@localhost:5432/auditmind_test" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
